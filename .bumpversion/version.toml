[tool.bumpversion]
current_version = "3.1.0"
commit = true
message = "Bump version v{current_version} -> v{new_version}"

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = 'path = "./proc-macro-error-attr", version = "={current_version}"'
replace = 'path = "./proc-macro-error-attr", version = "={new_version}"'

[[tool.bumpversion.files]]
filename = "proc-macro-error-attr/Cargo.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""
