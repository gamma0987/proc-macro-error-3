[package]
name = "proc-macro-error3-test-suite"
version = "3.0.1"
authors = [
  "CreepySkeleton <creepy-skeleton@yandex.ru>",
  "GnomedDev <david2005thomas@gmail.com>",
  "gamma0987 <gamma0987@posteo.de>",
]
description = "Test suite for proc-macro-error3"
repository = "https://github.com/gamma0987/proc-macro-error3"
rust-version = "1.61"
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
path = "lib.rs"
proc-macro = true

[dependencies]
proc-macro-error3 = { path = "../", version = "=3.0.1" }
proc-macro2 = "1.0.74"
quote = "1.0.35"
syn = { version = "2.0.46", features = ["full"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = { level = "allow" }
