[package]
name = "test-crate"
version = "0.0.0"
authors = [
  "CreepySkeleton <creepy-skeleton@yandex.ru>",
  "GnomedDev <david2005thomas@gmail.com>",
  "gamma0987 <gamma0987@posteo.de>",
]
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
path = "lib.rs"
proc-macro = true

[dependencies]
proc-macro-error3 = { path = "../" }
proc-macro2 = "1.0.74"
quote = "1.0.35"
syn = { version = ">=2.0.46,<4", features = ["full"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = { level = "allow" }
